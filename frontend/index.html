<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopAssist AI — Customer Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0a0a0a;
      --surface:     #111111;
      --border:      #222222;
      --border-mid:  #2e2e2e;
      --text:        #f0f0f0;
      --text-muted:  #777777;
      --user-bg:     #1c1c1c;
      --bot-bg:      #ffffff;
      --bot-text:    #0a0a0a;
      --accent:      #ffffff;
      --scrollbar:   #2a2a2a;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }

    .logo {
      width: 36px; height: 36px;
      border: 1.5px solid var(--border-mid);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .header-info h1 {
      font-size: 15px; font-weight: 600; letter-spacing: -0.3px;
    }
    .header-info p {
      font-size: 12px; color: var(--text-muted); margin-top: 1px;
    }

    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      background: #4caf50;
      border-radius: 50%;
      margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .btn-clear {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border-mid);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 12px; font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-clear:hover { border-color: var(--accent); color: var(--accent); }
    .btn-clear svg { width: 13px; height: 13px; }

    .btn-report {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      background: transparent;
      border: 1px solid #ff4d4d;
      border-radius: 8px;
      color: #ff4d4d;
      font-size: 12px; font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-report:hover { background: #ff4d4d; color: white; }
    .btn-report svg { width: 13px; height: 13px; }

    /* ── Messages ────────────────────────────────────────────── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

    /* ── Message row ─────────────────────────────────────────── */
    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.25s ease forwards;
      opacity: 0;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      border: 1px solid var(--border-mid);
    }
    .avatar.bot  { background: #fff; color: #000; }
    .avatar.user { background: #1c1c1c; color: #fff; }

    .bubble {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .bubble.bot {
      background: var(--bot-bg);
      color: var(--bot-text);
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: var(--user-bg);
      color: var(--text);
      border: 1px solid var(--border-mid);
      border-bottom-right-radius: 4px;
    }

    /* bold/highlight in bot bubble */
    .bubble.bot strong { font-weight: 600; }

    /* ── Typing indicator ────────────────────────────────────── */
    .typing-indicator {
      display: none;
      gap: 10px;
      align-items: flex-end;
      animation: fadeUp 0.2s ease forwards;
    }
    .typing-indicator.visible { display: flex; }

    .typing-dots {
      background: var(--bot-bg);
      padding: 12px 16px;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      display: flex; gap: 5px; align-items: center;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-5px); }
    }

    /* ── Welcome screen ──────────────────────────────────────── */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }
    .welcome-icon {
      font-size: 48px;
      margin-bottom: 8px;
      filter: grayscale(1);
    }
    .welcome h2 { font-size: 20px; font-weight: 600; color: var(--text); }
    .welcome p  { font-size: 14px; max-width: 380px; line-height: 1.6; }

    .chips {
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center; margin-top: 8px;
    }
    .chip {
      padding: 7px 14px;
      border: 1px solid var(--border-mid);
      border-radius: 20px;
      font-size: 13px; color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      font-family: inherit;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Input bar ───────────────────────────────────────────── */
    .input-bar {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 20px;
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex; align-items: flex-end; gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border-mid);
      border-radius: 14px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: #555; }

    textarea {
      flex: 1;
      background: transparent;
      border: none; outline: none; resize: none;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    textarea::placeholder { color: var(--text-muted); }
    textarea::-webkit-scrollbar { display: none; }

    .btn-send {
      width: 34px; height: 34px; flex-shrink: 0;
      background: var(--accent);
      border: none; border-radius: 9px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; opacity: 0.4;
    }
    .btn-send.active { opacity: 1; }
    .btn-send:hover { transform: scale(1.05); }
    .btn-send svg { width: 16px; height: 16px; }

    .input-hint {
      font-size: 11px; color: var(--text-muted);
      margin-top: 8px; text-align: center;
    }

    /* ── Error toast ─────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #1a1a1a; border: 1px solid #333;
      color: #ff6b6b; padding: 10px 18px; border-radius: 10px;
      font-size: 13px; display: none; z-index: 999;
      animation: fadeUp 0.2s ease forwards;
    }
    .toast.show { display: block; }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header>
    <div class="header-left">
      <div class="logo">🛍️</div>
      <div class="header-info">
        <h1>ShopAssist AI</h1>
        <p><span class="status-dot"></span>Online · Customer Support</p>
      </div>
    </div>
    <div class="header-right" style="display: flex; gap: 10px;">
      <button class="btn-report" id="btnReport" title="Report an issue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        Report Issue
      </button>
      <button class="btn-clear" id="btnClear" title="Clear conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
        New chat
      </button>
    </div>
  </header>

  <!-- Messages -->
  <div class="messages" id="messages">

    <!-- Welcome (hidden once chat starts) -->
    <div class="welcome" id="welcome">
      <div class="welcome-icon">💬</div>
      <h2>How can I help you today?</h2>
      <p>Ask about orders, returns, shipping, payments — or raise a support ticket.</p>
      <div class="chips">
        <button class="chip" onclick="sendChip('What is your return policy?')">Return policy</button>
        <button class="chip" onclick="sendChip('How long does shipping take?')">Shipping time</button>
        <button class="chip" onclick="sendChip('I want to track my order')">Track order</button>
        <button class="chip" onclick="sendChip('I want to report an issue')">Report issue</button>
      </div>
    </div>

    <!-- Typing indicator -->
    <div class="typing-indicator" id="typingIndicator">
      <div class="avatar bot">AI</div>
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div><!-- /messages -->

  <!-- Input -->
  <div class="input-bar">
    <div class="input-wrap">
      <textarea
        id="userInput"
        placeholder="Type your message…"
        rows="1"
        maxlength="1000"
      ></textarea>
      <button class="btn-send" id="btnSend">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Press <kbd style="border:1px solid #333;padding:1px 5px;border-radius:4px;font-size:10px;">Enter</kbd> to send &nbsp;·&nbsp; <kbd style="border:1px solid #333;padding:1px 5px;border-radius:4px;font-size:10px;">Shift+Enter</kbd> for new line</div>
  </div>

</div><!-- /app -->

<div class="toast" id="toast"></div>

<script>
  const API_BASE   = 'http://localhost:8000';
  const sessionId  = 'sess-' + Math.random().toString(36).slice(2, 10);

  const messagesEl  = document.getElementById('messages');
  const welcome     = document.getElementById('welcome');
  const typingEl    = document.getElementById('typingIndicator');
  const inputEl     = document.getElementById('userInput');
  const btnSend     = document.getElementById('btnSend');
  const btnClear    = document.getElementById('btnClear');
  const toastEl     = document.getElementById('toast');

  let isLoading = false;

  // ── Auto-resize textarea ───────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = inputEl.scrollHeight + 'px';
    btnSend.classList.toggle('active', inputEl.value.trim().length > 0);
  });

  // ── Send on Enter (Shift+Enter = newline) ─────────────────────
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  btnSend.addEventListener('click', sendMessage);

  // ── Clear session ─────────────────────────────────────────────
  btnClear.addEventListener('click', async () => {
    try {
      await fetch(`${API_BASE}/clear`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId }),
      });
    } catch (_) {}

    // Remove all message rows (keep welcome + typing)
    messagesEl.querySelectorAll('.msg-row').forEach(el => el.remove());
    welcome.style.display = 'flex';
    inputEl.value = '';
    inputEl.style.height = 'auto';
    btnSend.classList.remove('active');
  });

  document.getElementById('btnReport').addEventListener('click', () => {
    sendChip('I want to report an issue');
  });

  // ── Chip shortcut ─────────────────────────────────────────────
  function sendChip(text) {
    inputEl.value = text;
    btnSend.classList.add('active');
    sendMessage();
  }

  // ── Core send ─────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    // Hide welcome
    welcome.style.display = 'none';

    // Append user bubble
    appendBubble('user', text);

    // Reset input
    inputEl.value = '';
    inputEl.style.height = 'auto';
    btnSend.classList.remove('active');

    // Show typing
    isLoading = true;
    showTyping(true);

    try {
      const res = await fetch(`${API_BASE}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }

      const data = await res.json();
      showTyping(false);
      appendBubble('bot', data.response);

    } catch (err) {
      showTyping(false);
      showToast('Error: ' + err.message);
      appendBubble('bot', '⚠️ Sorry, something went wrong. Please try again.');
    } finally {
      isLoading = false;
      inputEl.focus();
    }
  }

  // ── Append a message bubble ───────────────────────────────────
  function appendBubble(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'bot' ? 'AI' : 'You';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.innerHTML = formatText(text);

    if (role === 'bot') {
      row.appendChild(avatar);
      row.appendChild(bubble);
    } else {
      row.appendChild(bubble);
      row.appendChild(avatar);
    }

    // Insert before typing indicator
    messagesEl.insertBefore(row, typingEl);
    scrollBottom();
  }

  // ── Typing indicator ──────────────────────────────────────────
  function showTyping(show) {
    typingEl.classList.toggle('visible', show);
    if (show) scrollBottom();
  }

  // ── Scroll to bottom ──────────────────────────────────────────
  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Toast error ───────────────────────────────────────────────
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 4000);
  }

  // ── Basic text formatter ──────────────────────────────────────
  function formatText(raw) {
    return raw
      // **bold**
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      // *italic*
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      // newlines → <br>
      .replace(/\n/g, '<br>');
  }

  // ── Focus on load ─────────────────────────────────────────────
  inputEl.focus();
</script>
</body>
</html>
